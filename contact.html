<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nostra | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Nostra</a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section contact-hero">
      <div class="container">
        <p class="eyebrow">We are here to help</p>
        <h1 class="collection-title">Contact Nostra</h1>
        <p class="collection-subtext">Questions about orders, sizes, or returns? Send us a message.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <article class="contact-card">
          <h2>Customer Support</h2>
          <p>Email: support@nostra.com</p>
          <p>Phone: +91 98765 43210</p>
          <p>Hours: Mon - Sat, 10:00 AM to 7:00 PM</p>
        </article>

        <form class="contact-form" id="contactForm" action="#" method="post">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>2026 Nostra. We would love to hear from you.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
